plugins {
    id 'com.android.application'
}

android {
    namespace 'com.glasstv.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.glasstv.tvhome')
        // lite = Android 4.4/5.0 老盒子（minSdk 19 + versionName 带 -lite，见 skill tv-launcher-release-rules）。
        def lite = providers.gradleProperty('liteBuild').getOrElse('false').toBoolean()
        minSdk (lite ? 19 : 21)
        multiDexEnabled true
        targetSdk 34
        versionCode 61
        versionName lite ? '4.0.0-lite' : '4.0.0'
    }

    signingConfigs {
        release {
            storeFile file('../keystore/cleanyourtv.keystore')
            storePassword 'cleanyourtv123'
            keyAlias 'cleanyourtv'
            keyPassword 'cleanyourtv123'
        }
    }

    /**
     * 功能档位：lite = 给 Android 4.4/5.0 老盒子用的精简版（去掉航拍视频壁纸、必应每日壁纸、
     * 时钟屏保、航空下载等重活），standard = 完整版。用 -PliteBuild=true 切换。
     */
    def liteBuild = providers.gradleProperty('liteBuild').getOrElse('false').toBoolean()
    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // K 定制: 用自有签名, 覆盖安装不丢数据
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // 精简版靠 BuildConfig.LITE 在运行期隐藏重功能入口（不删代码：删了还要牵连引用，
        // 而且这些功能本来就是 opt-in，留着不影响启动内存）
        buildConfigField "boolean", "LITE", "${liteBuild}"
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // 老电视兼容: java.time / java.util.function 等在 API 21 上靠 desugar 补
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // 快传页的二维码（纯 Java 生成，无网络、无 Google 依赖）
    implementation 'com.google.zxing:core:3.5.3'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
